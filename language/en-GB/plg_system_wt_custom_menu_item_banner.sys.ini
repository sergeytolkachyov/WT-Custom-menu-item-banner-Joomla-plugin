PLG_WT_CUSTOM_MENU_ITEM_BANNER_MAYBE_INTERESTING="<h4>It may be interesting</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/web-assets\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla 4 & Joomla 5 Web Assets.</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomshopping\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">JoomShopping extensions</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomla-plugins\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla plugins</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomla-modules\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla modules</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/components\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla components</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomla-libraries\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla libraries for developers.</a></li></ul>"
PLG_WT_CUSTOM_MENU_ITEM_BANNER_WHATS_NEW="<h3>v.1.3.0 What's new?</h3><h4>Responsive videos in the default layout</h4><ul><li>The default layout now provides responsive poster images and defers video loading until the poster has been decoded.</li><li>The <code>prefers-reduced-motion</code> preference and <code>Save-Data</code> mode are respected. Relative media URLs now work correctly when Joomla is installed in a subdirectory.</li><li>Source priority is now documented: rows are checked from top to bottom and the first match wins; non-overlapping CSS media query ranges are recommended.</li></ul>"
