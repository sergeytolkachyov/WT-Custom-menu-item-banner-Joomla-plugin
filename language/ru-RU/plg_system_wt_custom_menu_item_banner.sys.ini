PLG_WT_CUSTOM_MENU_ITEM_BANNER_WHATS_NEW="<h3>v.1.3.0 Что нового?</h3><h4>Адаптивные видео в штатном макете</h4><ul><li>Штатный макет получил адаптивные poster-изображения и отложенную загрузку видео после декодирования poster.</li><li>Учтены системная настройка <code>prefers-reduced-motion</code> и режим экономии трафика <code>Save-Data</code>. Относительные URL медиафайлов теперь корректно работают при установке Joomla в подкаталог.</li><li>Добавлена документация приоритета источников: строки проверяются сверху вниз, используется первое совпадение; рекомендуется задавать непересекающиеся диапазоны CSS media query.</li></ul>"
